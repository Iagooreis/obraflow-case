<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alçadas | ObraFlow</title>
    <link rel="stylesheet" href="/static/site.css">
    <script src="/static/alcadas.js" defer></script>
</head>
<body>
    <header>
        <a href="/">ObraFlow</a>
    </header>

    <main>
        <h1>Alçadas de aprovação</h1>
        <p>Escolha uma obra para configurar quem aprova seus pedidos.</p>

        <label for="obra">Obra</label>
        <select id="obra" name="obra">
            <option value="">Selecione uma obra</option>
            {% for obra in obras %}
                <option value="{{ obra.id_obra }}">{{ obra.nome_obra }}</option>
            {% endfor %}
        </select>

        <section id="faixas" aria-label="Faixas de aprovação"></section>
        <div class="acoes-alcadas">
            <button id="adicionar-faixa" type="button" disabled>+ Adicionar faixa</button>
            <button id="salvar-alcadas" type="button" disabled>Salvar alterações</button>
        </div>
        <p id="mensagem" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
